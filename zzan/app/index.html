<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>짠 (ZZAN)</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="갑자기 돌아온 건배사, 3초 만에 짠!">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@400;600;800&display=swap">
<style>
/* 레이아웃: 한 화면 앱. 위에서부터 대상 고르기 → 제시어 → 카드 덱(가운데, 스와이프) → 버튼. 크게 보기는 검은 무대 전체 화면. */
:root {
  --bg: #eef2ef;
  --surface: #ffffff;
  --ink: #14261d;
  --muted: #5d6e65;
  --line: #d5ddd8;
  --bottle: #1e7a50;      /* 소주병 초록 */
  --bottle-ink: #ffffff;
  --foam: #e8a317;        /* 맥주 거품 노랑 */
  --foam-ink: #1d1500;
  --foam-text: #8f5d00;
  --pass: #7f8a84;
  --warn: #b3261e;
  --scrim: rgba(10, 20, 15, .45);
  --shadow: 0 1px 2px rgba(20, 38, 29, .08), 0 14px 32px -14px rgba(20, 38, 29, .28);
  --stage-bg: #000000;    /* 크게 보기: 테마와 상관없이 고대비 */
  --stage-fg: #ffffff;
  --stage-hl: #ffd24a;
  --stage-dim: #a0a0a0;
  --f-display: "Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-body: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1f18; --surface: #172d23; --ink: #e8f2ec; --muted: #9db3a7; --line: #2a463b;
    --bottle: #4cc28a; --bottle-ink: #08170f; --foam: #f5b83d; --foam-ink: #1d1500; --foam-text: #f5b83d;
    --pass: #8a9c93; --warn: #ffb4a9; --scrim: rgba(0, 0, 0, .6);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 14px 32px -14px rgba(0, 0, 0, .7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1f18; --surface: #172d23; --ink: #e8f2ec; --muted: #9db3a7; --line: #2a463b;
  --bottle: #4cc28a; --bottle-ink: #08170f; --foam: #f5b83d; --foam-ink: #1d1500; --foam-text: #f5b83d;
  --pass: #8a9c93; --warn: #ffb4a9; --scrim: rgba(0, 0, 0, .6);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 14px 32px -14px rgba(0, 0, 0, .7);
  color-scheme: dark;
}

html { height: 100%; box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
*, *::before, *::after { box-sizing: inherit; }
[hidden] { display: none !important; }
body {
  height: 100%; margin: 0;
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 15px; line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
}
body.noscroll { overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--foam); outline-offset: 2px; }

.app {
  min-height: 100%; max-width: 520px; margin: 0 auto;
  display: flex; flex-direction: column; gap: 12px;
  padding-block: 14px 18px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* 머리 */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.logo { font-family: var(--f-display); font-size: 40px; line-height: 1; color: var(--bottle); }
.slogan { font-size: 13px; line-height: 1.35; color: var(--muted); font-weight: 600; }
.saved-btn {
  flex: none; min-height: 40px; padding: 0 14px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface); font-weight: 800; font-size: 14px;
}
.saved-btn b { color: var(--bottle); font-variant-numeric: tabular-nums; }

/* 대상 고르기 */
.targets {
  display: grid; grid-template-columns: repeat(var(--tabs, 5), 1fr); gap: 4px; padding: 4px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
}
.targets button {
  border: 0; background: transparent; color: var(--muted); border-radius: 12px;
  padding: 9px 2px 8px; display: flex; flex-direction: column; align-items: center; gap: 2px;
  font-weight: 800; font-size: 15px; line-height: 1.2;
}
.targets button small { font-weight: 600; font-size: 11px; font-variant-numeric: tabular-nums; opacity: .85; }
.targets button[aria-checked="true"] { background: var(--bottle); color: var(--bottle-ink); }

/* 제시어 */
.find { display: flex; gap: 8px; }
.find input {
  flex: 1; min-width: 0; min-height: 46px; padding: 0 14px; border-radius: 14px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  font: 600 16px var(--f-body);
}
.find input::placeholder { color: var(--muted); font-weight: 400; }
.btn {
  min-height: 46px; padding: 0 14px; border-radius: 14px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); font-weight: 800; font-size: 15px; white-space: nowrap;
}
.btn-bottle { background: var(--bottle); color: var(--bottle-ink); border-color: transparent; }
.btn-foam { background: var(--foam); color: var(--foam-ink); border-color: transparent; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; min-height: 34px; padding: 0 12px; border-radius: 999px;
  border: 1px solid var(--line); background: transparent; color: var(--muted); font-weight: 600; font-size: 14px;
}
.chip[aria-pressed="true"] { border-color: var(--bottle); color: var(--bottle); background: var(--surface); font-weight: 800; }
.chip-meme { border-style: dashed; color: var(--foam-text); font-weight: 800; }
.chip-meme[aria-pressed="true"] { border-style: solid; border-color: transparent; background: var(--foam); color: var(--foam-ink); }
.chip-sep { flex: none; width: 1px; margin: 6px 2px; background: var(--line); }
.chip-label { flex: none; align-self: center; padding-right: 2px; font-size: 12px; font-weight: 800; color: var(--muted); }
.note { margin: 0; font-size: 14px; color: var(--muted); }
.link { border: 0; background: none; padding: 0; color: var(--bottle); font-weight: 800; text-decoration: underline; text-underline-offset: 3px; }

/* 카드 덱 */
.deck { position: relative; flex: 1; min-height: 340px; display: grid; }
.stack-edge {
  position: absolute; left: 14px; right: 14px; top: 16px; bottom: -8px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 22px; opacity: .55;
}
.card {
  position: relative; z-index: 1; min-width: 0; overflow: hidden;
  background: var(--surface); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow);
  padding: 16px 18px 14px; display: flex; flex-direction: column; gap: 14px;
  touch-action: pan-y; user-select: none; -webkit-user-select: none; cursor: grab;
}
.card.enter { animation: pop .22s ease-out; }
@keyframes pop { from { transform: translateY(10px) scale(.97); opacity: .4; } to { transform: none; opacity: 1; } }
.card-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.kw { font-family: var(--f-display); font-size: 22px; line-height: 1; letter-spacing: .04em; }
.who { font-size: 13px; font-weight: 800; color: var(--muted); }
.pick { padding: 2px 8px; border-radius: 999px; background: var(--bottle); color: var(--bottle-ink); font-size: 12px; font-weight: 800; }
.skill {
  margin-left: auto; padding: 4px 10px; border-radius: 999px;
  background: var(--foam); color: var(--foam-ink); font-size: 12px; font-weight: 800;
}
.meme { padding: 2px 8px; border: 1px dashed currentColor; border-radius: 999px; color: var(--foam-text); font-size: 12px; font-weight: 800; }
.lines { list-style: none; margin: 0; padding: 0; flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 18px; }
.line { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 12px; align-items: start; }
.syl {
  width: 46px; height: 46px; border-radius: 12px; background: var(--bottle); color: var(--bottle-ink);
  font-family: var(--f-display); font-size: 27px; line-height: 46px; text-align: center;
}
.line.two .syl { background: var(--foam); color: var(--foam-ink); }
.role { display: block; font-size: 11.5px; font-weight: 800; letter-spacing: .04em; color: var(--muted); }
.txt p { margin: 3px 0 0; font-size: 18px; font-weight: 600; line-height: 1.45; word-break: keep-all; overflow-wrap: anywhere; }
.line.two .txt p { font-family: var(--f-display); font-weight: 400; font-size: 23px; line-height: 1.35; }
.init { font-style: normal; color: var(--bottle); }
.line.two .init { color: var(--foam-text); }
.lines.three { gap: 12px; }
.lines.three .line.two .txt p { font-size: 21px; }
.beats { display: inline-flex; flex-wrap: wrap; gap: 4px 6px; }
.beat { display: inline-flex; flex-direction: column; align-items: center; }
.beat::before { content: "●"; font-size: .36em; line-height: 1; margin-bottom: .3em; color: var(--foam-text); }
.cw { display: inline-block; }
.card-foot { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; font-size: 13px; color: var(--muted); }
.tip { min-width: 0; }
.count { flex: none; font-variant-numeric: tabular-nums; font-weight: 600; }
.stamp {
  position: absolute; top: 54px; padding: 2px 12px; border: 3px solid; border-radius: 10px;
  font-family: var(--f-display); font-size: 26px; opacity: 0; pointer-events: none; background: var(--surface);
}
.stamp-save { left: 16px; color: var(--bottle); transform: rotate(-12deg); }
.stamp-pass { right: 16px; color: var(--pass); transform: rotate(12deg); }
.empty { margin: auto; color: var(--muted); }

.actions { display: grid; grid-template-columns: 1fr 1.25fr 1fr; gap: 8px; padding-top: 6px; }
.actions .btn { min-height: 52px; }
.howto { margin: 0; text-align: center; font-size: 12.5px; color: var(--muted); text-wrap: balance; }

/* 크게 보기 */
.stage {
  position: fixed; inset: 0; z-index: 50; background: var(--stage-bg); color: var(--stage-fg);
  display: flex; flex-direction: column; gap: 10px;
  padding: calc(12px + env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));
}
.stage-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.stage-meta { font-size: 14px; color: var(--stage-dim); font-weight: 600; min-width: 0; }
.stage-close {
  flex: none; min-height: 44px; padding: 0 18px; border-radius: 999px;
  border: 1px solid #4a4a4a; background: #161616; color: var(--stage-fg); font-weight: 800;
}
.stage-body { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: center; }
.stage-inner { --fs: 64px; display: flex; flex-direction: column; gap: .2em; }
.stage .s-role { font-size: 15px; font-weight: 800; letter-spacing: .06em; color: var(--stage-dim); }
.stage .s1 { margin: 0 0 .5em; font-size: calc(var(--fs) * .52); font-weight: 800; line-height: 1.3; word-break: keep-all; }
.stage .s2 { margin: 0; font-family: var(--f-display); font-size: var(--fs); line-height: 1.18; color: var(--stage-hl); word-break: keep-all; }
.stage .init { color: var(--stage-hl); }
.stage .s2 .init { color: var(--stage-fg); }
.stage .beat::before { color: var(--stage-fg); }
.stage-foot { font-size: 13px; color: var(--stage-dim); text-align: center; font-variant-numeric: tabular-nums; }

/* 저장함 */
.scrim { position: fixed; inset: 0; z-index: 40; background: var(--scrim); }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-width: 520px; max-height: 82%; margin: 0 auto;
  background: var(--surface); color: var(--ink); border-radius: 22px 22px 0 0; box-shadow: var(--shadow);
  display: flex; flex-direction: column; gap: 12px;
  padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.sheet-head h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 24px; }
.saved-list { list-style: none; margin: 0; padding: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
.saved-item { border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.saved-meta { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.saved-meta b { font-family: var(--f-display); font-weight: 400; font-size: 18px; }
.saved-meta span { font-size: 13px; color: var(--muted); font-weight: 600; }
.saved-item p { margin: 0; font-size: 15px; word-break: keep-all; overflow-wrap: anywhere; }
.saved-actions { display: flex; gap: 8px; }
.saved-actions .btn { min-height: 38px; font-size: 14px; }
.saved-empty { color: var(--muted); text-align: center; padding: 24px 8px; }

.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 60;
  transform: translate(-50%, 12px); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 800; font-size: 14px;
  max-width: calc(100% - 32px); text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.stage:not([hidden]) ~ .toast { bottom: calc(56px + env(safe-area-inset-bottom, 0px)); }

/* 카드 본문: 앞 멘트 → 행 → 구호 */
.body { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 14px; }
.body .lines { flex: none; }
.intro { margin: 0; font-size: 16.5px; font-weight: 600; line-height: 1.6; word-break: keep-all; overflow-wrap: anywhere; }
.dir { color: var(--muted); font-weight: 400; font-size: .88em; }
.line { grid-template-columns: auto minmax(0, 1fr); }
.line.bare { grid-template-columns: minmax(0, 1fr); }
.syl { width: auto; min-width: 46px; padding: 0 6px; white-space: nowrap; }
.syl.wide { font-size: 19px; padding: 0 10px; }
.cr { display: flex; flex-direction: column; gap: 8px; padding-top: 12px; border-top: 1px dashed var(--line); }
.cue { margin: 0; font-size: 14px; color: var(--muted); word-break: keep-all; }
.cr-row { display: flex; flex-direction: column; gap: 1px; }
.cr-tag { font-size: 11.5px; font-weight: 800; letter-spacing: .04em; color: var(--muted); }
.cr-call { margin: 0; font-size: 19px; font-weight: 800; line-height: 1.35; word-break: keep-all; }
.cr-resp { margin: 0; font-family: var(--f-display); font-size: 25px; line-height: 1.3; color: var(--foam-text); word-break: keep-all; }
.cr-resp .init { color: var(--ink); }
.after { margin: 0; font-size: 13px; color: var(--muted); word-break: keep-all; }
.who { min-width: 0; }
.time.over { color: var(--warn); font-weight: 800; }
.card.dense .body { gap: 10px; }
.card.dense .intro { font-size: 15px; line-height: 1.5; }
.card.dense .lines { gap: 8px; }
.card.dense .txt p { font-size: 16px; }
.card.dense .syl { min-width: 36px; height: 36px; line-height: 36px; font-size: 21px; border-radius: 10px; }
.card.dense .cr { gap: 6px; padding-top: 10px; }
.card.dense .cr-call { font-size: 17px; }
.card.dense .cr-resp { font-size: 22px; }
.stage .dir { color: var(--stage-dim); font-size: .8em; }
.stage-body.scroll { overflow-y: auto; justify-content: flex-start; }

/* 세로가 짧은 폰: 버튼까지 한 화면에 들어오게 줄임 */
@media (max-height: 720px) {
  .app { gap: 9px; padding-block: 10px 12px; }
  .deck { min-height: 250px; }
  .card { gap: 10px; padding: 14px 16px 12px; }
  .lines { gap: 12px; }
  .body { gap: 10px; }
  .howto { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <span class="logo">짠</span>
      <span class="slogan">갑자기 돌아온 건배사,<br>3초 만에 짠!</span>
    </div>
    <button type="button" class="saved-btn" id="openSaved">저장함 <b id="savedCount">0</b></button>
  </header>

  <div class="targets" id="targets" role="radiogroup" aria-label="누구 앞에서 하나요?"></div>
  <div class="chips" id="occasions" aria-label="어떤 자리인가요?"></div>

  <form class="find" id="findForm" autocomplete="off">
    <input id="kw" type="search" maxlength="12" placeholder="찾기 (예: 기우제, 청바지)" aria-label="건배사 찾기">
    <button type="submit" class="btn">찾기</button>
    <button type="button" class="btn btn-foam" id="randomBtn">랜덤</button>
  </form>
  <div class="chips" id="chips" aria-label="건배사 형식"></div>
  <p class="note" id="note" hidden></p>

  <section class="deck" aria-label="건배사 카드">
    <div class="stack-edge" aria-hidden="true"></div>
    <article class="card" id="card" tabindex="0"></article>
  </section>

  <div class="actions">
    <button type="button" class="btn" id="passBtn">← 패스</button>
    <button type="button" class="btn btn-bottle" id="bigBtn">크게 보기</button>
    <button type="button" class="btn" id="saveBtn">저장 →</button>
  </div>
  <p class="howto">→ 밀면 저장 · ← 밀면 다음 · 카드 누르면 크게 · 흔들면 랜덤</p>
</div>

<div class="stage" id="stage" role="dialog" aria-modal="true" aria-label="크게 보기" hidden>
  <div class="stage-top">
    <span class="stage-meta" id="stageMeta"></span>
    <button type="button" class="stage-close" id="stageClose">닫기</button>
  </div>
  <div class="stage-body" id="stageBody"><div class="stage-inner" id="stageInner"></div></div>
  <div class="stage-foot" id="stageWake"></div>
</div>

<div id="sheetWrap" hidden>
  <div class="scrim" id="scrim"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <h2 id="sheetTitle">저장한 건배사</h2>
      <button type="button" class="btn" id="sheetClose">닫기</button>
    </div>
    <ul class="saved-list" id="savedList"></ul>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
// 건배사 데이터: zzan/build.py가 CSV에서 자동으로 채움. 직접 고치지 말고 CSV를 고친 뒤 python3 zzan/build.py 실행.
const DATA = /*PRESETS:START*/[
{"f": "이야기", "k": "구두 이야기", "t": ["부장님", "동기", "친목"], "src": "n", "sub": "송년회·연말", "intro": "얼마 전 구두를 바꿨습니다. 올해 초에 새로 산 구두인데 굽이 많이 닳아 있더군요. 한 해 동안 다사다난했고 아쉬움도 있었지만, 치열하게 뛴 만큼 새해에는 더 좋은 일이 가득할 거라 믿습니다.", "call": "우리는", "resp": "믿는다!", "o": ["송년회"], "id": "7bcd3ad2"},
{"f": "이야기", "k": "인디언 기우제", "t": ["부장님", "동기"], "src": "n", "sub": "힘든 시기 극복", "intro": "인디언들이 기우제를 지내면 반드시 비가 온다고 합니다. 비가 올 때까지 기우제를 지내기 때문입니다. 우리도 끝까지 해냅시다.", "call": "할 수", "resp": "있다!", "id": "aa9e59a2"},
{"f": "이야기", "k": "컴퍼니의 어원", "t": ["부장님", "동기"], "src": "n", "sub": "팀워크·동료애", "intro": "회사(Company)의 어원은 '함께(Com) 빵(Panis)을 나누어 먹는 사람들'이라고 합니다. 가족보다 더 많은 시간을 함께 보내는 우리가 서로 격려하며 파이팅하는 그룹이 되길 바랍니다.", "call": "함께 가면", "resp": "멀리 간다!", "id": "2dc5cf02"},

const TARGETS = ['맞춤', '부장님', '동기', '친목', '가족'].filter((t) => DATA.some((d) => d.t.includes(t)));
const OCCASIONS = ['단독 회식', '임원 합석', '송년회', '신년회', '환영회', '송별회', '승진 축하', '청첩장 모임', '명절', '생신'];
const FORMATS = ['대본', '이야기', '줄임말', '행시', '구호'];
// AI 초안에 붙는 발성 기술. r1: 첫 줄, rm: 가운데 줄, r2: 마지막 줄
const SKILL = {
  '스타카토':   { r1: '나',            rm: '나',                r2: '●마다 끊어서 다 같이',     tip: '●마다 딱! 딱! 끊어서 외치기' },
  '크레센도':   { r1: '차분하게 시작',  rm: '조금 더 크게',       r2: '점점 크게, 끝에서 터뜨리기', tip: '작게 시작해서 마지막 단어에서 터뜨리기' },
  '콜&리스폰스': { r1: '선창 · 나',      rm: '선창 · 나',          r2: '후창 · 다 같이',           tip: '내가 앞줄을 외치면 다 같이 마지막 줄로 받기' },
  '훅&드롭':    { r1: '훅 · 진지하게',  rm: '훅 · 계속 진지하게',  r2: '드롭 · 한 박자 쉬고 반전',  tip: '앞줄은 진지하게, 한 박자 쉬고 마지막 줄에서 반전' },
};
const NO_SKILL = { r1: '', rm: '', r2: '', tip: '' };
const roleOf = (sk, i, n) => (i === 0 ? sk.r1 : i === n - 1 ? sk.r2 : sk.rm);
// 노트에 적어 둔 실전 팁
const FORMAT_TIP = {
  '대본': '앞 멘트는 3문장, 20초 안에 끊기',
  '이야기': '앞 멘트는 3문장, 20초 안에 끊기',
  '줄임말': '뜻풀이 앞에서 1초 뜸 들이기',
  '행시': '각 행 앞에서 1초 뜸 들이기',
  '구호': '구호를 먼저 알려 주고 외치기',
};
const TIME_LIMIT = 30; // 노트의 기준: 건배사는 30초 안에

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* 저장 못 해도 앱은 동작 */ } },
};
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

/* 글 안의 표시: [글자]는 강조, {지문}은 흐리게 */
const rich = (text) => esc(text).replace(/\[(.+?)\]/g, '<em class="init">$1</em>').replace(/\{(.+?)\}/g, '<span class="dir">($1)</span>');
const plain = (text) => String(text || '').replace(/\{.+?\}/g, '').replace(/[\[\]]/g, '').replace(/\s+/g, ' ').trim();
const badgeOf = (text) => (text.match(/\[(.+?)\]/g) || []).map((m) => m.slice(1, -1)).join('');

let target = TARGETS.includes(store.get('zzan.tab')) ? store.get('zzan.tab') : TARGETS[0];
let occasion = '';
let occasionPicked = false; // 사용자가 직접 고른 뒤에는 계절 기본값을 쓰지 않음
let format = '';
let query = '';
let order = [];
let pos = 0;
let busy = false;
let saved = store.get('zzan.saved2', []);
if (!Array.isArray(saved)) saved = [];
let draftsOn = store.get('zzan.drafts', false) === true; // AI 초안은 기본으로 숨김
let memeOn = store.get('zzan.meme', true) !== false;

const card = $('#card');

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
const current = () => order[pos];

/* ---------- 어떤 카드를 보여 줄지 ---------- */
const MEME_MONTHS = 3; // 밈 카드는 등록일로부터 3개월 뒤 자동으로 숨김
const ymd = (s) => { const [y, m, d] = String(s || '').split('-').map(Number); return y && m && d ? [y, m, d] : null; };
function memeExpired(d) { const p = d.m && ymd(d.d); return !!p && new Date() >= new Date(p[0], p[1] - 1 + MEME_MONTHS, p[2]); }
function pastDue(d) { const p = ymd(d.x); return !!p && new Date() >= new Date(p[0], p[1] - 1, p[2] + 1); }
const inSeason = (d) => !d.mo || d.mo.includes(new Date().getMonth() + 1);
const live = (d) => !memeExpired(d) && !pastDue(d) && inSeason(d);
const visible = (d) => live(d) && (d.src === 'n' || (draftsOn && (memeOn || !d.m)));
const inTab = (d) => d.t.includes(target);
const hasDrafts = () => DATA.some((d) => inTab(d) && d.src === 'd' && live(d));
const hasLiveMemes = () => DATA.some((d) => inTab(d) && d.m && live(d));

/* 자리: 송년회·환영회 같은 모임 종류. 자리가 비어 있는 카드는 언제나 쓸 수 있음 */
function seasonalOccasion() {
  const now = new Date();
  const m = now.getMonth() + 1;
  if ((m === 11 && now.getDate() >= 15) || m === 12) return '송년회';
  if (m === 1) return '신년회';
  return '';
}
const occasionsFor = () => OCCASIONS.filter((o) => DATA.some((d) => inTab(d) && visible(d) && d.o && d.o.includes(o)));
function settleOccasion() {
  const have = occasionsFor();
  if (occasionPicked) { if (occasion && !have.includes(occasion)) occasion = ''; return; }
  const s = seasonalOccasion();
  occasion = have.includes(s) ? s : '';
}
const isFor = (d) => !!(occasion && d.o && d.o.includes(occasion));
const fitsOccasion = (d) => !occasion || !d.o || d.o.includes(occasion);
const formatsFor = () => FORMATS.filter((f) => DATA.some((d) => inTab(d) && visible(d) && fitsOccasion(d) && d.f === f));
const textOf = (d) => [d.k, d.sub, d.intro, ...(d.lines || []), d.call, d.resp, d.after].map(plain).join(' ');
const hasQuery = (d) => !query || textOf(d).includes(query);
// 보여 주는 순서: 내 노트 → 고른 자리에 맞춘 카드 → 추천 → 나머지. 같은 순위 안에서는 섞음
const rank = (d) => (d.src === 'n' ? 8 : 0) + (isFor(d) ? 4 : 0) + (d.r ? 2 : 0) + (!occasion && !d.o ? 1 : 0);
const ranked = (list) => shuffle(list).sort((a, b) => rank(b) - rank(a));

/* ---------- 말할 내용 ---------- */
// 구호를 외치기 전에 미리 알려 주는 한마디
function cueOf(d) {
  if (d.call && d.resp) return `제가 ‘${plain(d.call)}’ 하면 ‘${plain(d.resp)}’ 외쳐 주십시오.`;
  if (d.resp) return `다 같이 ‘${plain(d.resp)}’ 외쳐 주십시오.`;
  return '';
}
// 말하는 데 걸리는 시간 어림 (1초에 5.5글자)
function speakSeconds(d) {
  const said = [d.intro, ...(d.lines || []), cueOf(d), d.call, d.resp].map(plain).join('');
  return Math.round(said.replace(/[^가-힣0-9A-Za-z]/g, '').length / 5.5);
}
// 구호가 따로 없으면 마지막 줄을 다 같이 외침
const shoutsLastLine = (d) => !d.call && !d.resp;

// AI 초안의 마지막 줄: 스타카토는 ●, 크레센도는 점점 크게
function finaleHTML(d, text) {
  if (d.s === '스타카토' && text.includes('·')) {
    return `<span class="beats">${text.split('·').map((b) => `<span class="beat"><span>${rich(b)}</span></span>`).join('')}</span>`;
  }
  if (d.s === '크레센도') {
    const w = text.split(' ');
    return w.map((x, i) => `<span class="cw" style="font-size:${(0.8 + 0.6 * i / Math.max(1, w.length - 1)).toFixed(2)}em">${rich(x)}</span>`).join(' ');
  }
  return rich(text);
}

/* ---------- 그리기 ---------- */
// 고른 버튼이 줄 밖으로 밀려나 있으면 보이는 곳으로 당김
function revealPressed(el, sel) {
  const on = el.querySelector(sel);
  if (!on || on.textContent === '전체') { el.scrollLeft = 0; return; }
  const r = on.getBoundingClientRect();
  const c = el.getBoundingClientRect();
  if (r.left < c.left || r.right > c.right) el.scrollLeft = Math.max(0, el.scrollLeft + r.left - c.left - 64);
}

function renderTargets() {
  $('#targets').innerHTML = TARGETS.map((t) => {
    const n = DATA.filter((d) => d.t.includes(t) && visible(d)).length;
    return `<button type="button" role="radio" aria-checked="${t === target}" data-t="${esc(t)}">${esc(t)}<small>${n}장</small></button>`;
  }).join('');
}

function renderOccasions() {
  const have = occasionsFor();
  const el = $('#occasions');
  el.hidden = !have.length;
  el.innerHTML = '<span class="chip-label">자리</span>' + ['', ...have].map((o) =>
    `<button type="button" class="chip" aria-pressed="${o === occasion}" data-o="${esc(o)}">${o ? esc(o) : '전체'}</button>`
  ).join('');
  revealPressed(el, '[data-o][aria-pressed="true"]');
}

function renderFormats() {
  const el = $('#chips');
  const toggles = [
    hasDrafts() ? `<button type="button" class="chip chip-meme" id="draftToggle" aria-pressed="${draftsOn}">AI 초안 ${draftsOn ? '켬' : '끔'}</button>` : '',
    draftsOn && hasLiveMemes() ? `<button type="button" class="chip chip-meme" id="memeToggle" aria-pressed="${memeOn}">밈 ${memeOn ? '켬' : '끔'}</button>` : '',
  ].join('');
  el.innerHTML = '<span class="chip-label">형식</span>' + ['', ...formatsFor()].map((f) =>
    `<button type="button" class="chip" aria-pressed="${f === format}" data-f="${esc(f)}">${f ? esc(f) : '전체'}</button>`
  ).join('') + (toggles ? '<span class="chip-sep" aria-hidden="true"></span>' + toggles : '');
  revealPressed(el, '[data-f][aria-pressed="true"]');
}

function linesHTML(d) {
  const ls = d.lines || [];
  if (!ls.length) return '';
  const sk = SKILL[d.s] || NO_SKILL;
  return `<ol class="lines${ls.length > 2 ? ' three' : ''}">${ls.map((text, i) => {
    const last = shoutsLastLine(d) && i === ls.length - 1;
    const role = d.s ? roleOf(sk, i, ls.length) : last ? '다 같이' : '';
    const b = badgeOf(text);
    return `
      <li class="line${last ? ' two' : ''}${b ? '' : ' bare'}">${b ? `<span class="syl${b.length > 1 ? ' wide' : ''}" aria-hidden="true">${esc(b)}</span>` : ''}
        <div class="txt">${role ? `<span class="role">${esc(role)}</span>` : ''}<p>${last && d.s ? finaleHTML(d, text) : rich(text)}</p></div></li>`;
  }).join('')}
    </ol>`;
}

function shoutHTML(d) {
  if (shoutsLastLine(d)) return '';
  const cue = cueOf(d);
  return `<div class="cr">
      ${cue ? `<p class="cue">${esc(cue)}</p>` : ''}
      ${d.call ? `<div class="cr-row"><span class="cr-tag">${d.resp ? '선창 · 나' : '외침 · 나'}</span><p class="${d.resp ? 'cr-call' : 'cr-resp'}">${rich(d.call)}</p></div>` : ''}
      ${d.resp ? `<div class="cr-row"><span class="cr-tag">${d.call ? '후창 · 다 같이' : '다 같이'}</span><p class="cr-resp">${rich(d.resp)}</p></div>` : ''}
    </div>`;
}

function cardHTML(d) {
  const sec = speakSeconds(d);
  const tip = d.s ? (SKILL[d.s] || NO_SKILL).tip : FORMAT_TIP[d.f] || '';
  const sub = d.sub || (d.o ? d.o.join(' · ') : '');
  const time = sec >= 10 ? `<span class="time${sec > TIME_LIMIT ? ' over' : ''}">약 ${sec}초${sec > TIME_LIMIT ? ' · 30초 넘음' : ''}</span> · ` : '';
  return `
    <div class="card-head">
      <span class="kw">${esc(d.k)}</span>
      ${sub ? `<span class="who">${esc(sub)}</span>` : ''}
      ${d.r ? '<span class="pick">추천</span>' : ''}
      ${d.m ? `<span class="meme">밈 · ${esc(d.m)}</span>` : ''}
      ${d.src === 'd' ? '<span class="meme">AI 초안</span>' : ''}
      <span class="skill">${esc(d.s || d.f)}</span>
    </div>
    <div class="body">
      ${d.intro ? `<p class="intro">${rich(d.intro)}</p>` : ''}
      ${linesHTML(d)}
      ${shoutHTML(d)}
      ${d.after ? `<p class="after">${esc(d.after)}</p>` : ''}
    </div>
    <div class="card-foot"><span class="tip">${esc(tip)}</span><span class="count">${time}${pos + 1} / ${order.length}</span></div>
    <span class="stamp stamp-save" aria-hidden="true">저장</span>
    <span class="stamp stamp-pass" aria-hidden="true">패스</span>`;
}

function renderCard(enter) {
  const d = current();
  card.style.transition = 'none';
  card.style.transform = '';
  if (!d) { card.innerHTML = '<p class="empty">건배사가 없어요.</p>'; card.removeAttribute('aria-label'); return; }
  card.innerHTML = cardHTML(d);
  card.classList.toggle('dense', textOf(d).length > 110);
  const spoken = [d.intro, ...(d.lines || []), d.call, d.resp].map(plain).filter(Boolean).join(' ').split('·').join(' ');
  card.setAttribute('aria-label', `${d.k}, ${d.f}. ${spoken}`);
  if (enter && !reduceMotion) { card.classList.remove('enter'); void card.offsetWidth; card.classList.add('enter'); }
}

function rebuild() {
  const note = $('#note');
  note.hidden = true;
  if (format && !formatsFor().includes(format)) format = '';
  const pick = () => DATA.filter((d) => inTab(d) && visible(d) && fitsOccasion(d) && (!format || d.f === format) && hasQuery(d));
  let pool = pick();
  if (query && !pool.length) {
    if (format && DATA.some((d) => inTab(d) && visible(d) && fitsOccasion(d) && hasQuery(d))) {
      format = ''; // 다른 형식에 있으면 형식을 풀어 줌
    } else if (DATA.some((d) => inTab(d) && visible(d) && hasQuery(d))) {
      occasion = ''; // 다른 자리에 있으면 자리를 풀어 줌
      occasionPicked = true;
      format = '';
    } else {
      const word = esc(query);
      const inDrafts = !draftsOn && DATA.some((d) => inTab(d) && live(d) && d.src === 'd' && hasQuery(d));
      const inMemes = draftsOn && !memeOn && DATA.some((d) => inTab(d) && live(d) && d.m && hasQuery(d));
      const others = TARGETS.filter((t) => t !== target && DATA.some((d) => d.t.includes(t) && visible(d) && hasQuery(d)));
      if (inDrafts) {
        note.innerHTML = `‘${word}’ 건배사는 AI 초안에 있어요. <button type="button" class="link" data-drafts-on data-q="${word}">AI 초안 켜기</button>`;
      } else if (inMemes) {
        note.innerHTML = `‘${word}’ 건배사는 밈 카드예요. <button type="button" class="link" data-meme-on data-q="${word}">밈 켜기</button>`;
      } else if (others.length) {
        note.innerHTML = `‘${word}’ 건배사는 ${others.map((t) => `<button type="button" class="link" data-switch="${esc(t)}" data-q="${word}">${esc(t)}</button>`).join(', ')} 쪽에 있어요.`;
      } else {
        note.innerHTML = `‘${word}’ 건배사는 아직 없어요.`;
      }
      note.hidden = false;
      query = '';
      $('#kw').value = '';
    }
    pool = pick();
  }
  order = ranked(pool);
  pos = 0;
  renderOccasions();
  renderFormats();
  renderCard(true);
}

/* ---------- 넘기기·저장 ---------- */
const savedCards = () => saved.map((id) => DATA.find((d) => d.id === id)).filter(Boolean);
const showSavedCount = () => { $('#savedCount').textContent = savedCards().length; };

function next() {
  pos++;
  if (pos >= order.length) { order = ranked(order); pos = 0; toast('다 봤어요. 다시 섞었어요'); }
  renderCard(true);
}

function save(d) {
  if (!saved.includes(d.id)) { saved.unshift(d.id); store.set('zzan.saved2', saved); }
  showSavedCount();
}

function fly(dir) {
  const d = current();
  if (busy || !d) return;
  busy = true;
  const dur = reduceMotion ? 0 : 220;
  const stamp = card.querySelector(dir > 0 ? '.stamp-save' : '.stamp-pass');
  if (stamp) stamp.style.opacity = 1;
  card.style.transition = `transform ${dur}ms ease-in`;
  card.style.transform = `translateX(${dir * 130}%) rotate(${dir * 16}deg)`;
  setTimeout(() => {
    if (dir > 0) { save(d); openBig(d); toast('저장했어요'); }
    next();
    busy = false;
  }, dur);
}

/* 손가락으로 밀기 */
let drag = null;
function setDrag(dx) {
  card.style.transform = `translateX(${dx}px) rotate(${dx / 20}deg)`;
  const s = card.querySelector('.stamp-save');
  const p = card.querySelector('.stamp-pass');
  if (s) s.style.opacity = Math.max(0, Math.min(1, dx / 90));
  if (p) p.style.opacity = Math.max(0, Math.min(1, -dx / 90));
}
function snap() {
  card.style.transition = reduceMotion ? 'none' : 'transform .18s ease-out';
  card.style.transform = '';
  card.querySelectorAll('.stamp').forEach((s) => { s.style.opacity = 0; });
}
card.addEventListener('pointerdown', (e) => {
  if (busy || (e.pointerType === 'mouse' && e.button !== 0)) return;
  drag = { x: e.clientX, y: e.clientY, id: e.pointerId, dx: 0, moved: false };
  card.style.transition = 'none';
});
card.addEventListener('pointermove', (e) => {
  if (!drag || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.x;
  const dy = e.clientY - drag.y;
  if (!drag.moved) {
    if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
    if (Math.abs(dy) > Math.abs(dx)) { drag = null; return; }
    drag.moved = true;
    try { card.setPointerCapture(e.pointerId); } catch (err) { /* 무시 */ }
  }
  drag.dx = dx;
  setDrag(dx);
});
function endDrag(e, cancelled) {
  if (!drag || e.pointerId !== drag.id) return;
  const { dx, moved } = drag;
  drag = null;
  if (cancelled) { snap(); return; }
  if (!moved) { openBig(current()); return; }
  if (dx > 90) fly(1);
  else if (dx < -90) fly(-1);
  else snap();
}
card.addEventListener('pointerup', (e) => endDrag(e, false));
card.addEventListener('pointercancel', (e) => endDrag(e, true));

/* ---------- 크게 보기 + 화면 켜짐 유지 5분 ---------- */
const WAKE_MS = 5 * 60 * 1000;
let wakeLock = null;
const wakeSupported = 'wakeLock' in navigator;
let wakeUntil = 0;
let wakeTimer = null;

async function requestWake() {
  if (!wakeSupported) return;
  try {
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', () => { wakeLock = null; });
  } catch (e) { wakeLock = null; }
}
function showWake() {
  const left = wakeUntil - Date.now();
  const el = $('#stageWake');
  if (left <= 0) { stopWake(); el.textContent = '5분이 지나 화면 켜짐 유지를 껐어요'; return; }
  if (!wakeSupported) { el.textContent = '이 브라우저에서는 화면 켜짐 유지가 안 돼요'; return; }
  const m = Math.floor(left / 60000);
  const s = Math.floor((left % 60000) / 1000);
  el.textContent = wakeLock ? `화면 켜짐 유지 중 ${m}:${String(s).padStart(2, '0')}` : '화면 켜짐 유지를 켜지 못했어요';
}
async function keepAwake() {
  wakeUntil = Date.now() + WAKE_MS;
  await requestWake();
  showWake();
  clearInterval(wakeTimer);
  wakeTimer = setInterval(showWake, 1000);
}
function stopWake() {
  clearInterval(wakeTimer);
  wakeUntil = 0;
  if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && !$('#stage').hidden && Date.now() < wakeUntil && !wakeLock) requestWake();
});

const MIN_STAGE_FONT = 44;
function fitStage() {
  const body = $('#stageBody');
  const inner = $('#stageInner');
  body.classList.remove('scroll');
  body.scrollTop = 0;
  let fs = Math.min(150, Math.max(MIN_STAGE_FONT, body.clientWidth * 0.17));
  for (let i = 0; i < 80; i++) {
    inner.style.setProperty('--fs', fs + 'px');
    if (inner.offsetHeight <= body.clientHeight && inner.scrollWidth <= inner.clientWidth) return;
    if (fs <= MIN_STAGE_FONT) break;
    fs = Math.max(MIN_STAGE_FONT, fs - 3);
  }
  body.classList.add('scroll'); // 긴 대본은 글씨를 더 줄이지 않고 밀어서 읽음
}
// 말하는 순서 그대로: 앞 멘트 → 행 → 구호 예고 → 선창 → 후창
function stageHTML(d) {
  const sk = SKILL[d.s] || NO_SKILL;
  const ls = d.lines || [];
  const parts = [];
  if (d.intro) parts.push(`<p class="s1">${rich(d.intro)}</p>`);
  ls.forEach((text, i) => {
    const last = shoutsLastLine(d) && i === ls.length - 1;
    const role = d.s ? roleOf(sk, i, ls.length) : last ? '다 같이' : '';
    if (role) parts.push(`<span class="s-role">${esc(role)}</span>`);
    parts.push(`<p class="${last ? 's2' : 's1'}">${last && d.s ? finaleHTML(d, text) : rich(text)}</p>`);
  });
  const cue = cueOf(d);
  if (cue) parts.push(`<p class="s1">${esc(cue)}</p>`);
  if (d.call) parts.push(`<span class="s-role">${d.resp ? '선창 · 나' : '외침 · 나'}</span><p class="${d.resp ? 's1' : 's2'}">${rich(d.call)}</p>`);
  if (d.resp) parts.push(`<span class="s-role">${d.call ? '후창 · 다 같이' : '다 같이'}</span><p class="s2">${rich(d.resp)}</p>`);
  return parts.join('');
}
function openBig(d) {
  if (!d) return;
  $('#stageMeta').textContent = [d.k, d.sub, d.s || d.f].filter(Boolean).join(' · ');
  $('#stageInner').innerHTML = stageHTML(d);
  $('#stage').hidden = false;
  document.body.classList.add('noscroll');
  fitStage();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (!$('#stage').hidden) fitStage(); });
  keepAwake();
  $('#stageClose').focus();
}
function closeBig() {
  $('#stage').hidden = true;
  document.body.classList.remove('noscroll');
  stopWake();
  card.focus({ preventScroll: true });
}
window.addEventListener('resize', () => { if (!$('#stage').hidden) fitStage(); });

/* ---------- 랜덤 + 흔들기 ---------- */
function randomPick(fromShake) {
  query = '';
  format = '';
  $('#kw').value = '';
  $('#note').hidden = true;
  order = shuffle(DATA.filter((d) => inTab(d) && visible(d) && fitsOccasion(d)));
  pos = 0;
  renderFormats();
  renderCard(true);
  toast(fromShake ? '흔들어서 뽑았어요' : '랜덤으로 뽑았어요');
  if (fromShake && navigator.vibrate) navigator.vibrate(40);
}
let motionOn = false;
let lastAcc = null;
let lastShake = 0;
function onMotion(e) {
  const a = e.accelerationIncludingGravity;
  if (!a || a.x == null) return;
  if (lastAcc) {
    const delta = Math.abs(a.x - lastAcc.x) + Math.abs(a.y - lastAcc.y) + Math.abs(a.z - lastAcc.z);
    const now = Date.now();
    if (delta > 30 && now - lastShake > 1500 && $('#stage').hidden) { lastShake = now; randomPick(true); }
  }
  lastAcc = { x: a.x, y: a.y, z: a.z };
}
function enableMotion() {
  if (motionOn || typeof DeviceMotionEvent === 'undefined') return;
  if (typeof DeviceMotionEvent.requestPermission === 'function') {
    // 아이폰: 버튼을 누를 때만 권한을 물어볼 수 있음
    DeviceMotionEvent.requestPermission().then((s) => {
      if (s === 'granted') { window.addEventListener('devicemotion', onMotion); motionOn = true; }
    }).catch(() => {});
  } else {
    window.addEventListener('devicemotion', onMotion);
    motionOn = true;
  }
}

/* ---------- 저장함 ---------- */
function renderSaved() {
  const list = savedCards();
  $('#savedList').innerHTML = list.length
    ? list.map((d) => {
      const body = [d.intro, ...(d.lines || []), d.call && d.resp ? `${d.call} → ${d.resp}` : d.call || d.resp].map(plain).filter(Boolean);
      return `
      <li class="saved-item">
        <div class="saved-meta"><b>${esc(d.k)}</b><span>${esc([d.f, d.sub].filter(Boolean).join(' · '))}${d.src === 'd' ? ' · AI 초안' : ''}${live(d) ? '' : ' (기간 지남)'}</span></div>
        <p>${body.map(esc).join('<br>')}</p>
        <div class="saved-actions">
          <button type="button" class="btn btn-bottle" data-big="${esc(d.id)}">크게 보기</button>
          <button type="button" class="btn" data-del="${esc(d.id)}">삭제</button>
        </div>
      </li>`;
    }).join('')
    : '<li class="saved-empty">아직 저장한 건배사가 없어요.<br>카드를 오른쪽으로 밀면 여기에 모여요.</li>';
}
function openSaved() { renderSaved(); $('#sheetWrap').hidden = false; document.body.classList.add('noscroll'); $('#sheetClose').focus(); }
function closeSaved() { $('#sheetWrap').hidden = true; document.body.classList.remove('noscroll'); $('#openSaved').focus(); }

/* ---------- 알림 ---------- */
let toastTimer;
function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1600);
}

/* ---------- 연결 ---------- */
function switchTarget(t) {
  target = t;
  store.set('zzan.tab', target);
  format = '';
  if (!occasionsFor().includes(occasion)) occasionPicked = false;
  settleOccasion();
  renderTargets();
  rebuild();
}
function setDrafts(on) {
  draftsOn = on;
  store.set('zzan.drafts', on);
  settleOccasion();
  renderTargets();
}
function setMemes(on) {
  memeOn = on;
  store.set('zzan.meme', on);
  settleOccasion();
  renderTargets();
}
$('#targets').addEventListener('click', (e) => {
  const b = e.target.closest('[data-t]');
  if (!b) return;
  query = '';
  $('#kw').value = '';
  switchTarget(b.dataset.t);
});
$('#occasions').addEventListener('click', (e) => {
  const b = e.target.closest('[data-o]');
  if (!b) return;
  occasion = b.dataset.o;
  occasionPicked = true;
  query = '';
  $('#kw').value = '';
  rebuild();
});
$('#chips').addEventListener('click', (e) => {
  if (e.target.closest('#draftToggle')) {
    setDrafts(!draftsOn);
    toast(draftsOn ? 'AI 초안을 뒤쪽에 넣었어요' : 'AI 초안을 뺐어요');
    rebuild();
    return;
  }
  if (e.target.closest('#memeToggle')) {
    setMemes(!memeOn);
    toast(memeOn ? '밈 건배사를 넣었어요. 3개월 지나면 자동으로 빠져요' : '밈 건배사를 뺐어요');
    rebuild();
    return;
  }
  const b = e.target.closest('[data-f]');
  if (!b) return;
  format = b.dataset.f;
  rebuild();
});
$('#note').addEventListener('click', (e) => {
  const b = e.target.closest('[data-q]');
  if (!b) return;
  query = b.dataset.q;
  $('#kw').value = query;
  if ('draftsOn' in b.dataset) { setDrafts(true); rebuild(); }
  else if ('memeOn' in b.dataset) { setMemes(true); rebuild(); }
  else if (b.dataset.switch) switchTarget(b.dataset.switch);
});
$('#findForm').addEventListener('submit', (e) => {
  e.preventDefault();
  query = $('#kw').value.trim();
  $('#kw').blur();
  rebuild();
});
$('#kw').addEventListener('input', () => { if (!$('#kw').value && query) { query = ''; rebuild(); } });
$('#randomBtn').addEventListener('click', () => { enableMotion(); randomPick(false); });
$('#passBtn').addEventListener('click', () => fly(-1));
$('#saveBtn').addEventListener('click', () => fly(1));
$('#bigBtn').addEventListener('click', () => openBig(current()));
$('#stageClose').addEventListener('click', closeBig);
$('#openSaved').addEventListener('click', openSaved);
$('#sheetClose').addEventListener('click', closeSaved);
$('#scrim').addEventListener('click', closeSaved);
$('#savedList').addEventListener('click', (e) => {
  const big = e.target.closest('[data-big]');
  const del = e.target.closest('[data-del]');
  if (big) { const d = DATA.find((x) => x.id === big.dataset.big); closeSaved(); openBig(d); }
  if (del) {
    saved = saved.filter((id) => id !== del.dataset.del);
    store.set('zzan.saved2', saved);
    showSavedCount();
    renderSaved();
    toast('삭제했어요');
  }
});
document.addEventListener('keydown', (e) => {
  if (!$('#stage').hidden) { if (e.key === 'Escape') closeBig(); return; }
  if (!$('#sheetWrap').hidden) { if (e.key === 'Escape') closeSaved(); return; }
  if (e.target.matches('input')) return;
  if (e.key === 'ArrowRight') fly(1);
  else if (e.key === 'ArrowLeft') fly(-1);
  else if (e.key === 'Enter' && document.activeElement === card) openBig(current());
});

/* ---------- 시작 ---------- */
$('#targets').style.setProperty('--tabs', Math.max(1, TARGETS.length));
showSavedCount();
settleOccasion();
renderTargets();
rebuild();
if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission !== 'function') enableMotion();
</script>
</body>
</html>
