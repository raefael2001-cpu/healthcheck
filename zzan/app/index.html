<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>짠 (ZZAN)</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="갑자기 돌아온 건배사, 3초 만에 짠!">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@400;600;800&display=swap">
<style>
/* 레이아웃: 한 화면 앱. 위에서부터 대상 고르기 → 제시어 → 카드 덱(가운데, 스와이프) → 버튼. 크게 보기는 검은 무대 전체 화면. */
:root {
  --bg: #eef2ef;
  --surface: #ffffff;
  --ink: #14261d;
  --muted: #5d6e65;
  --line: #d5ddd8;
  --bottle: #1e7a50;      /* 소주병 초록 */
  --bottle-ink: #ffffff;
  --foam: #e8a317;        /* 맥주 거품 노랑 */
  --foam-ink: #1d1500;
  --foam-text: #8f5d00;
  --pass: #7f8a84;
  --scrim: rgba(10, 20, 15, .45);
  --shadow: 0 1px 2px rgba(20, 38, 29, .08), 0 14px 32px -14px rgba(20, 38, 29, .28);
  --stage-bg: #000000;    /* 크게 보기: 테마와 상관없이 고대비 */
  --stage-fg: #ffffff;
  --stage-hl: #ffd24a;
  --stage-dim: #a0a0a0;
  --f-display: "Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-body: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1f18; --surface: #172d23; --ink: #e8f2ec; --muted: #9db3a7; --line: #2a463b;
    --bottle: #4cc28a; --bottle-ink: #08170f; --foam: #f5b83d; --foam-ink: #1d1500; --foam-text: #f5b83d;
    --pass: #8a9c93; --scrim: rgba(0, 0, 0, .6);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 14px 32px -14px rgba(0, 0, 0, .7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1f18; --surface: #172d23; --ink: #e8f2ec; --muted: #9db3a7; --line: #2a463b;
  --bottle: #4cc28a; --bottle-ink: #08170f; --foam: #f5b83d; --foam-ink: #1d1500; --foam-text: #f5b83d;
  --pass: #8a9c93; --scrim: rgba(0, 0, 0, .6);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 14px 32px -14px rgba(0, 0, 0, .7);
  color-scheme: dark;
}

html { height: 100%; box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
*, *::before, *::after { box-sizing: inherit; }
[hidden] { display: none !important; }
body {
  height: 100%; margin: 0;
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 15px; line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
}
body.noscroll { overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--foam); outline-offset: 2px; }

.app {
  min-height: 100%; max-width: 520px; margin: 0 auto;
  display: flex; flex-direction: column; gap: 12px;
  padding-block: 14px 18px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* 머리 */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.logo { font-family: var(--f-display); font-size: 40px; line-height: 1; color: var(--bottle); }
.slogan { font-size: 13px; line-height: 1.35; color: var(--muted); font-weight: 600; }
.saved-btn {
  flex: none; min-height: 40px; padding: 0 14px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface); font-weight: 800; font-size: 14px;
}
.saved-btn b { color: var(--bottle); font-variant-numeric: tabular-nums; }

/* 대상 고르기 */
.targets {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 4px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
}
.targets button {
  border: 0; background: transparent; color: var(--muted); border-radius: 12px;
  padding: 9px 2px 8px; display: flex; flex-direction: column; align-items: center; gap: 2px;
  font-weight: 800; font-size: 15px; line-height: 1.2;
}
.targets button small { font-weight: 600; font-size: 11px; font-variant-numeric: tabular-nums; opacity: .85; }
.targets button[aria-checked="true"] { background: var(--bottle); color: var(--bottle-ink); }

/* 제시어 */
.find { display: flex; gap: 8px; }
.find input {
  flex: 1; min-width: 0; min-height: 46px; padding: 0 14px; border-radius: 14px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  font: 600 16px var(--f-body);
}
.find input::placeholder { color: var(--muted); font-weight: 400; }
.btn {
  min-height: 46px; padding: 0 14px; border-radius: 14px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); font-weight: 800; font-size: 15px; white-space: nowrap;
}
.btn-bottle { background: var(--bottle); color: var(--bottle-ink); border-color: transparent; }
.btn-foam { background: var(--foam); color: var(--foam-ink); border-color: transparent; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; min-height: 34px; padding: 0 12px; border-radius: 999px;
  border: 1px solid var(--line); background: transparent; color: var(--muted); font-weight: 600; font-size: 14px;
}
.chip[aria-pressed="true"] { border-color: var(--bottle); color: var(--bottle); background: var(--surface); font-weight: 800; }
.chip-meme { border-style: dashed; color: var(--foam-text); font-weight: 800; }
.chip-meme[aria-pressed="true"] { border-style: solid; border-color: transparent; background: var(--foam); color: var(--foam-ink); }
.chip-sep { flex: none; width: 1px; margin: 6px 2px; background: var(--line); }
.note { margin: 0; font-size: 14px; color: var(--muted); }
.link { border: 0; background: none; padding: 0; color: var(--bottle); font-weight: 800; text-decoration: underline; text-underline-offset: 3px; }

/* 카드 덱 */
.deck { position: relative; flex: 1; min-height: 340px; display: grid; }
.stack-edge {
  position: absolute; left: 14px; right: 14px; top: 16px; bottom: -8px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 22px; opacity: .55;
}
.card {
  position: relative; z-index: 1; min-width: 0; overflow: hidden;
  background: var(--surface); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow);
  padding: 16px 18px 14px; display: flex; flex-direction: column; gap: 14px;
  touch-action: pan-y; user-select: none; -webkit-user-select: none; cursor: grab;
}
.card.enter { animation: pop .22s ease-out; }
@keyframes pop { from { transform: translateY(10px) scale(.97); opacity: .4; } to { transform: none; opacity: 1; } }
.card-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.kw { font-family: var(--f-display); font-size: 22px; line-height: 1; letter-spacing: .04em; }
.who { font-size: 13px; font-weight: 800; color: var(--muted); }
.skill {
  margin-left: auto; padding: 4px 10px; border-radius: 999px;
  background: var(--foam); color: var(--foam-ink); font-size: 12px; font-weight: 800;
}
.meme { padding: 2px 8px; border: 1px dashed currentColor; border-radius: 999px; color: var(--foam-text); font-size: 12px; font-weight: 800; }
.lines { list-style: none; margin: 0; padding: 0; flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 18px; }
.line { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 12px; align-items: start; }
.syl {
  width: 46px; height: 46px; border-radius: 12px; background: var(--bottle); color: var(--bottle-ink);
  font-family: var(--f-display); font-size: 27px; line-height: 46px; text-align: center;
}
.line.two .syl { background: var(--foam); color: var(--foam-ink); }
.role { display: block; font-size: 11.5px; font-weight: 800; letter-spacing: .04em; color: var(--muted); }
.txt p { margin: 3px 0 0; font-size: 18px; font-weight: 600; line-height: 1.45; word-break: keep-all; overflow-wrap: anywhere; }
.line.two .txt p { font-family: var(--f-display); font-weight: 400; font-size: 23px; line-height: 1.35; }
.init { font-style: normal; color: var(--bottle); }
.line.two .init { color: var(--foam-text); }
.beats { display: inline-flex; flex-wrap: wrap; gap: 4px 6px; }
.beat { display: inline-flex; flex-direction: column; align-items: center; }
.beat::before { content: "●"; font-size: .36em; line-height: 1; margin-bottom: .3em; color: var(--foam-text); }
.cw { display: inline-block; }
.card-foot { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; font-size: 13px; color: var(--muted); }
.tip { min-width: 0; }
.count { flex: none; font-variant-numeric: tabular-nums; font-weight: 600; }
.stamp {
  position: absolute; top: 54px; padding: 2px 12px; border: 3px solid; border-radius: 10px;
  font-family: var(--f-display); font-size: 26px; opacity: 0; pointer-events: none; background: var(--surface);
}
.stamp-save { left: 16px; color: var(--bottle); transform: rotate(-12deg); }
.stamp-pass { right: 16px; color: var(--pass); transform: rotate(12deg); }
.empty { margin: auto; color: var(--muted); }

.actions { display: grid; grid-template-columns: 1fr 1.25fr 1fr; gap: 8px; padding-top: 6px; }
.actions .btn { min-height: 52px; }
.howto { margin: 0; text-align: center; font-size: 12.5px; color: var(--muted); text-wrap: balance; }

/* 크게 보기 */
.stage {
  position: fixed; inset: 0; z-index: 50; background: var(--stage-bg); color: var(--stage-fg);
  display: flex; flex-direction: column; gap: 10px;
  padding: calc(12px + env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));
}
.stage-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.stage-meta { font-size: 14px; color: var(--stage-dim); font-weight: 600; min-width: 0; }
.stage-close {
  flex: none; min-height: 44px; padding: 0 18px; border-radius: 999px;
  border: 1px solid #4a4a4a; background: #161616; color: var(--stage-fg); font-weight: 800;
}
.stage-body { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: center; }
.stage-inner { --fs: 64px; display: flex; flex-direction: column; gap: .2em; }
.stage .s-role { font-size: 15px; font-weight: 800; letter-spacing: .06em; color: var(--stage-dim); }
.stage .s1 { margin: 0 0 .5em; font-size: calc(var(--fs) * .52); font-weight: 800; line-height: 1.3; word-break: keep-all; }
.stage .s2 { margin: 0; font-family: var(--f-display); font-size: var(--fs); line-height: 1.18; color: var(--stage-hl); word-break: keep-all; }
.stage .init { color: var(--stage-hl); }
.stage .s2 .init { color: var(--stage-fg); }
.stage .beat::before { color: var(--stage-fg); }
.stage-foot { font-size: 13px; color: var(--stage-dim); text-align: center; font-variant-numeric: tabular-nums; }

/* 저장함 */
.scrim { position: fixed; inset: 0; z-index: 40; background: var(--scrim); }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-width: 520px; max-height: 82%; margin: 0 auto;
  background: var(--surface); color: var(--ink); border-radius: 22px 22px 0 0; box-shadow: var(--shadow);
  display: flex; flex-direction: column; gap: 12px;
  padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.sheet-head h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 24px; }
.saved-list { list-style: none; margin: 0; padding: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
.saved-item { border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.saved-meta { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.saved-meta b { font-family: var(--f-display); font-weight: 400; font-size: 18px; }
.saved-meta span { font-size: 13px; color: var(--muted); font-weight: 600; }
.saved-item p { margin: 0; font-size: 15px; word-break: keep-all; overflow-wrap: anywhere; }
.saved-actions { display: flex; gap: 8px; }
.saved-actions .btn { min-height: 38px; font-size: 14px; }
.saved-empty { color: var(--muted); text-align: center; padding: 24px 8px; }

.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 60;
  transform: translate(-50%, 12px); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 800; font-size: 14px;
  max-width: calc(100% - 32px); text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.stage:not([hidden]) ~ .toast { bottom: calc(56px + env(safe-area-inset-bottom, 0px)); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <span class="logo">짠</span>
      <span class="slogan">갑자기 돌아온 건배사,<br>3초 만에 짠!</span>
    </div>
    <button type="button" class="saved-btn" id="openSaved">저장함 <b id="savedCount">0</b></button>
  </header>

  <div class="targets" id="targets" role="radiogroup" aria-label="누구 앞에서 하나요?"></div>

  <form class="find" id="findForm" autocomplete="off">
    <input id="kw" type="search" maxlength="6" placeholder="제시어 (예: 건배)" aria-label="제시어">
    <button type="submit" class="btn">찾기</button>
    <button type="button" class="btn btn-foam" id="randomBtn">랜덤</button>
  </form>
  <div class="chips" id="chips" aria-label="제시어 목록"></div>
  <p class="note" id="note" hidden></p>

  <section class="deck" aria-label="건배사 카드">
    <div class="stack-edge" aria-hidden="true"></div>
    <article class="card" id="card" tabindex="0"></article>
  </section>

  <div class="actions">
    <button type="button" class="btn" id="passBtn">← 패스</button>
    <button type="button" class="btn btn-bottle" id="bigBtn">크게 보기</button>
    <button type="button" class="btn" id="saveBtn">저장 →</button>
  </div>
  <p class="howto">→ 밀면 저장 · ← 밀면 다음 · 카드 누르면 크게 · 흔들면 랜덤</p>
</div>

<div class="stage" id="stage" role="dialog" aria-modal="true" aria-label="크게 보기" hidden>
  <div class="stage-top">
    <span class="stage-meta" id="stageMeta"></span>
    <button type="button" class="stage-close" id="stageClose">닫기</button>
  </div>
  <div class="stage-body" id="stageBody"><div class="stage-inner" id="stageInner"></div></div>
  <div class="stage-foot" id="stageWake"></div>
</div>

<div id="sheetWrap" hidden>
  <div class="scrim" id="scrim"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <h2 id="sheetTitle">저장한 건배사</h2>
      <button type="button" class="btn" id="sheetClose">닫기</button>
    </div>
    <ul class="saved-list" id="savedList"></ul>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
// 건배사 데이터: zzan/presets-draft.csv에서 자동으로 채움. 직접 고치지 말고 CSV를 고친 뒤 python3 zzan/build.py 실행.

    return `<span class="beats">${d.l2.split('·').map((b, i) =>
      `<span class="beat"><span>${i === 0 ? initWrap(b) : esc(b)}</span></span>`).join('')}</span>`;
  }
  if (d.s === '크레센도') {
    const w = d.l2.split(' ');
    return w.map((x, i) => {
      const size = (0.8 + 0.6 * i / Math.max(1, w.length - 1)).toFixed(2);
      return `<span class="cw" style="font-size:${size}em">${i === 0 ? initWrap(x) : esc(x)}</span>`;
    }).join(' ');
  }

function renderCard(enter) {

  if (enter && !reduceMotion) { card.classList.remove('enter'); void card.offsetWidth; card.classList.add('enter'); }

function rebuild() {
  const fits = (d) => d.t === target && visible(d);
  let pool = DATA.filter((d) => fits(d) && (!keyword || d.k === keyword));
  const note = $('#note');
  note.hidden = true;
  if (keyword && !pool.length) {
    const memeOnly = !memeOn && DATA.some((d) => d.t === target && d.k === keyword && d.m && !memeExpired(d));
    const others = TARGETS.filter((t) => DATA.some((d) => d.t === t && d.k === keyword && visible(d)));
    if (memeOnly) {
      note.innerHTML = `‘${esc(keyword)}’ 건배사는 밈 카드예요. <button type="button" class="link" data-meme-on data-k="${esc(keyword)}">밈 포함 켜기</button>`;
    } else if (others.length) {
      note.innerHTML = `‘${esc(keyword)}’ 건배사는 ${others.map((t) => `<button type="button" class="link" data-switch="${esc(t)}" data-k="${esc(keyword)}">${esc(t)}</button>`).join(', ')} 쪽에 있어요.`;

  renderCard(true);
}

function save(d) {
  const id = idOf(d);
  if (!saved.includes(id)) { saved.unshift(id); store.set('zzan.saved', saved); }
  $('#savedCount').textContent = saved.length;
}

function fly(dir) {
  const d = current();
  if (busy || !d) return;
  busy = true;
  const dur = reduceMotion ? 0 : 220;
  const stamp = card.querySelector(dir > 0 ? '.stamp-save' : '.stamp-pass');
  if (stamp) stamp.style.opacity = 1;
  card.style.transition = `transform ${dur}ms ease-in`;
  card.style.transform = `translateX(${dir * 130}%) rotate(${dir * 16}deg)`;
  setTimeout(() => {
    if (dir > 0) { save(d); openBig(d); toast('저장했어요'); }
    next();
    busy = false;
  }, dur);

/* 손가락으로 밀기 */
let drag = null;
function setDrag(dx) {
  card.style.transform = `translateX(${dx}px) rotate(${dx / 20}deg)`;
  const s = card.querySelector('.stamp-save');
  const p = card.querySelector('.stamp-pass');
  if (s) s.style.opacity = Math.max(0, Math.min(1, dx / 90));
  if (p) p.style.opacity = Math.max(0, Math.min(1, -dx / 90));
}
function snap() {
  card.style.transition = reduceMotion ? 'none' : 'transform .18s ease-out';
  card.style.transform = '';
  card.querySelectorAll('.stamp').forEach((s) => { s.style.opacity = 0; });
}
card.addEventListener('pointerdown', (e) => {
  if (busy || (e.pointerType === 'mouse' && e.button !== 0)) return;

  card.style.transition = 'none';
});
card.addEventListener('pointermove', (e) => {
  if (!drag || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.x;
  const dy = e.clientY - drag.y;
  if (!drag.moved) {
    if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
    if (Math.abs(dy) > Math.abs(dx)) { drag = null; return; }
    drag.moved = true;
    try { card.setPointerCapture(e.pointerId); } catch (err) { /* 무시 */ }
  }
  drag.dx = dx;
  setDrag(dx);
});
function endDrag(e, cancelled) {
  if (!drag || e.pointerId !== drag.id) return;
  const { dx, moved } = drag;
  drag = null;
  if (cancelled) { snap(); return; }
  if (!moved) { openBig(current()); return; }
  if (dx > 90) fly(1);
  else if (dx < -90) fly(-1);
  else snap();
}
card.addEventListener('pointerup', (e) => endDrag(e, false));
card.addEventListener('pointercancel', (e) => endDrag(e, true));

/* ---------- 크게 보기 + 화면 켜짐 유지 5분 ---------- */
const WAKE_MS = 5 * 60 * 1000;
let wakeLock = null;
let wakeSupported = 'wakeLock' in navigator;
let wakeUntil = 0;
let wakeTimer = null;

async function requestWake() {
  if (!wakeSupported) return;
  try {
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', () => { wakeLock = null; });
  } catch (e) { wakeLock = null; }
}
function showWake() {
  const left = wakeUntil - Date.now();
  const el = $('#stageWake');
  if (left <= 0) { stopWake(); el.textContent = '5분이 지나 화면 켜짐 유지를 껐어요'; return; }
  if (!wakeSupported) { el.textContent = '이 브라우저에서는 화면 켜짐 유지가 안 돼요'; return; }
  const m = Math.floor(left / 60000);
  const s = Math.floor((left % 60000) / 1000);
  el.textContent = wakeLock ? `화면 켜짐 유지 중 ${m}:${String(s).padStart(2, '0')}` : '화면 켜짐 유지를 켜지 못했어요';
}
async function keepAwake() {
  wakeUntil = Date.now() + WAKE_MS;
  await requestWake();
  showWake();
  clearInterval(wakeTimer);
  wakeTimer = setInterval(showWake, 1000);
}
function stopWake() {
  clearInterval(wakeTimer);
  wakeUntil = 0;
  if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && !$('#stage').hidden && Date.now() < wakeUntil && !wakeLock) requestWake();
});

function fitStage() {
  const body = $('#stageBody');
  const inner = $('#stageInner');
  let fs = Math.min(150, Math.max(40, body.clientWidth * 0.17));
  for (let i = 0; i < 80; i++) {
    inner.style.setProperty('--fs', fs + 'px');
    if (inner.offsetHeight <= body.clientHeight && inner.scrollWidth <= inner.clientWidth) break;
    if (fs <= 24) break;
    fs -= 3;
  }
}
function openBig(d) {
  if (!d) return;
  const sk = SKILL[d.s] || { r1: '', r2: '' };
  $('#stageMeta').textContent = `${d.k} · ${d.t} · ${d.s}${d.m ? ' · 밈' : ''}`;
  $('#stageInner').innerHTML = `
    <span class="s-role">${esc(sk.r1)}</span><p class="s1">${initWrap(d.l1)}</p>
    <span class="s-role">${esc(sk.r2)}</span><p class="s2">${line2HTML(d)}</p>`;
  $('#stage').hidden = false;
  document.body.classList.add('noscroll');

  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (!$('#stage').hidden) fitStage(); });

  $('#stageClose').focus();
}
function closeBig() {
  $('#stage').hidden = true;
  document.body.classList.remove('noscroll');
  stopWake();

}
window.addEventListener('resize', () => { if (!$('#stage').hidden) fitStage(); });

function onMotion(e) {
  const a = e.accelerationIncludingGravity;
  if (!a || a.x == null) return;
  if (lastAcc) {
    const delta = Math.abs(a.x - lastAcc.x) + Math.abs(a.y - lastAcc.y) + Math.abs(a.z - lastAcc.z);
    const now = Date.now();
    if (delta > 30 && now - lastShake > 1500 && $('#stage').hidden) { lastShake = now; randomPick(true); }
  }
  lastAcc = { x: a.x, y: a.y, z: a.z };
}
function enableMotion() {
  if (motionOn || typeof DeviceMotionEvent === 'undefined') return;
  if (typeof DeviceMotionEvent.requestPermission === 'function') {
    // 아이폰: 버튼을 누를 때만 권한을 물어볼 수 있음
    DeviceMotionEvent.requestPermission().then((s) => {
      if (s === 'granted') { window.addEventListener('devicemotion', onMotion); motionOn = true; }
    }).catch(() => {});
  } else {
    window.addEventListener('devicemotion', onMotion);
    motionOn = true;
  }
}

/* ---------- 저장함 ---------- */
function renderSaved() {
  const list = saved.map((id) => DATA.find((d) => idOf(d) === id)).filter(Boolean);
  $('#savedList').innerHTML = list.length
    ? list.map((d) => `
      <li class="saved-item">
        <div class="saved-meta"><b>${esc(d.k)}</b><span>${esc(d.t)} · ${esc(d.s)}${d.m ? ` · 밈 ${esc(d.m)}` : ''}${memeExpired(d) ? ' (지난 밈)' : ''}</span></div>
        <p>${esc(d.l1)}<br>${esc(d.l2)}</p>
        <div class="saved-actions">
          <button type="button" class="btn btn-bottle" data-big="${esc(idOf(d))}">크게 보기</button>
          <button type="button" class="btn" data-del="${esc(idOf(d))}">삭제</button>
        </div>
      </li>`).join('')
    : '<li class="saved-empty">아직 저장한 건배사가 없어요.<br>카드를 오른쪽으로 밀면 여기에 모여요.</li>';
}
function openSaved() { renderSaved(); $('#sheetWrap').hidden = false; document.body.classList.add('noscroll'); $('#sheetClose').focus(); }
function closeSaved() { $('#sheetWrap').hidden = true; document.body.classList.remove('noscroll'); $('#openSaved').focus(); }

/* ---------- 알림 ---------- */
let toastTimer;
function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1600);
}

/* ---------- 연결 ---------- */
$('#targets').addEventListener('click', (e) => {
  const b = e.target.closest('[data-t]');
  if (!b) return;
  target = b.dataset.t;
  store.set('zzan.target', target);
  keyword = '';
  $('#kw').value = '';
  renderTargets();
  rebuild();
});
$('#chips').addEventListener('click', (e) => {
  if (e.target.closest('#memeToggle')) {
    memeOn = !memeOn;
    store.set('zzan.meme', memeOn);
    if (!memeOn && keyword && !DATA.some((d) => d.t === target && d.k === keyword && visible(d))) { keyword = ''; $('#kw').value = ''; }
    toast(memeOn ? '밈 건배사를 넣었어요. 3개월 지나면 자동으로 빠져요' : '밈 건배사를 뺐어요');
    renderTargets();
    rebuild();
    return;
  }
  const b = e.target.closest('[data-k]');
  if (!b) return;
  keyword = b.dataset.k;
  $('#kw').value = keyword;
  rebuild();
});
$('#note').addEventListener('click', (e) => {
  const m = e.target.closest('[data-meme-on]');
  if (m) {
    memeOn = true;
    store.set('zzan.meme', true);
    keyword = m.dataset.k;
    renderTargets();
    rebuild();
    return;
  }
  const b = e.target.closest('[data-switch]');
  if (!b) return;
  target = b.dataset.switch;
  keyword = b.dataset.k;
  store.set('zzan.target', target);
  renderTargets();
  rebuild();
});
$('#findForm').addEventListener('submit', (e) => {
  e.preventDefault();
  keyword = $('#kw').value.replace(/\s/g, '');
  $('#kw').blur();
  rebuild();
});
$('#kw').addEventListener('input', () => { if (!$('#kw').value && keyword) { keyword = ''; rebuild(); } });
$('#randomBtn').addEventListener('click', () => { enableMotion(); randomPick(false); });
$('#passBtn').addEventListener('click', () => fly(-1));
$('#saveBtn').addEventListener('click', () => fly(1));
$('#bigBtn').addEventListener('click', () => openBig(current()));
$('#stageClose').addEventListener('click', closeBig);
$('#openSaved').addEventListener('click', openSaved);
$('#sheetClose').addEventListener('click', closeSaved);
$('#scrim').addEventListener('click', closeSaved);
$('#savedList').addEventListener('click', (e) => {
  const big = e.target.closest('[data-big]');
  const del = e.target.closest('[data-del]');
  if (big) { const d = DATA.find((x) => idOf(x) === big.dataset.big); closeSaved(); openBig(d); }
  if (del) {
    saved = saved.filter((id) => id !== del.dataset.del);
    store.set('zzan.saved', saved);
    $('#savedCount').textContent = saved.length;
    renderSaved();
    toast('삭제했어요');
  }
});
document.addEventListener('keydown', (e) => {
  if (!$('#stage').hidden) { if (e.key === 'Escape') closeBig(); return; }
  if (!$('#sheetWrap').hidden) { if (e.key === 'Escape') closeSaved(); return; }
  if (e.target.matches('input')) return;
  if (e.key === 'ArrowRight') fly(1);
  else if (e.key === 'ArrowLeft') fly(-1);
  else if (e.key === 'Enter' && document.activeElement === card) openBig(current());
});

/* ---------- 시작 ---------- */
$('#savedCount').textContent = saved.length;
renderTargets();
rebuild();
if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission !== 'function') enableMotion();
</script>
</body>
</html>
